# proxygw 服务端 docker-compose 示例（默认使用 GHCR 预构建镜像）
# 使用前：准备 config.server.yaml，并按需修改下面的环境变量。
# TAG 可取 latest / main / sha-<commit> / v1.0.x（发布后）
services:
  proxygw-server:
    image: ghcr.io/waadri/proxygw-server:${TAG:-latest}
    container_name: proxygw-server
    restart: unless-stopped
    ports:
      - "${SERVER_LISTEN_PORT:-443}:443/tcp"
      - "${SERVER_LISTEN_PORT:-443}:443/udp"
      - "${HTTP_PROXY_PORT:-8080}:8080/tcp"
      - "${SOCKS5_PORT:-1080}:1080/tcp"
    environment:
      # 环境变量优先级最高，覆盖 config.server.yaml
      NP_STATE_DIR: /var/lib/proxygw/state
      NP_SERVER_LISTEN_ADDR: ":443"
      NP_SERVER_PUBLIC_URL: ${PUBLIC_URL:-}
      NP_PROXY_HTTP_LISTEN: ":8080"
      NP_PROXY_SOCKS5_LISTEN: ":1080"
      NP_PROXY_AUTH_MODE: ${AUTH_MODE:-required}
      NP_TLS_MODE: ${TLS_MODE:-pin}
      NP_TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      NP_TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      NP_TLS_CA_FILE: ${TLS_CA_FILE:-}
      NP_TLS_CLIENT_AUTH: ${TLS_CLIENT_AUTH:-none}
      NP_NODES_MTLS: ${NODES_MTLS:-false}
      NP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      NP_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NP_LOG_LEVEL: ${LOG_LEVEL:-info}
      NP_LOG_FORMAT: json
      NP_SECURITY_ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
    volumes:
      - proxygw-server-state:/var/lib/proxygw/state
      - ./config.server.yaml:/etc/proxygw/config.server.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/proxygw-server", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
    # QUIC 需要较大 UDP 缓冲；生产按需调整。
    sysctls:
      net.core.rmem_max: "2500000"
      net.core.wmem_max: "2500000"
    # 镜像内以非 root 运行，绑定 443/1080 依赖文件 capability（镜像已 setcap）；
    # 启用 no-new-privileges 会阻止该能力，因此这里不开启。
    # security_opt:
    #   - no-new-privileges:true
    # 如需从源码构建：取消下面 build 注释并执行 docker compose up -d --build
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile.server

volumes:
  proxygw-server-state:
