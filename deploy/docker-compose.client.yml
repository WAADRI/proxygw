# proxygw 节点侧 docker-compose 示例（默认使用 GHCR 预构建镜像）
#
# 用法（在仓库根目录执行）：
#   cp deploy/.env.client.example deploy/.env.client   # 填 SERVER_URL / AUTH_TOKEN / CLIENT_ID
#   docker compose -f deploy/docker-compose.client.yml --env-file deploy/.env.client up -d
#
# 一台机器跑多个节点：每个节点用不同 CLIENT_ID、不同 compose 项目名（-p），
# 例如 docker compose -f deploy/docker-compose.client.yml -p node-1 --env-file .env.node1 up -d
services:
  proxygw-client:
    # TAG 可取 latest / main / sha-<commit> / v1.0.x（发布后）
    image: ghcr.io/waadri/proxygw-client:${TAG:-latest}
    # 用 CLIENT_ID 作容器名，便于一机多节点时区分
    container_name: ${CLIENT_ID:-proxygw-client}
    restart: unless-stopped
    environment:
      SERVER_URL: ${SERVER_URL:?需要设置 SERVER_URL，例如 https://gw.example.com:443}
      AUTH_TOKEN: ${AUTH_TOKEN:?需要设置 AUTH_TOKEN（节点接入令牌）}
      CLIENT_ID: ${CLIENT_ID:?需要设置 CLIENT_ID，例如 node-docker-1}
      ALIAS: ${ALIAS:-}
      TAGS: ${TAGS:-docker}
      REGION: ${REGION:-}
      ISP_LABEL: ${ISP_LABEL:-}
      WEIGHT: ${WEIGHT:-100}
      TRANSPORT: ${TRANSPORT:-auto}
      QUIC_FALLBACK: ${QUIC_FALLBACK:-2s}
      PLANES: ${PLANES:-2}
      COMPRESSION: ${COMPRESSION:-true}
      STATE_DIR: /var/lib/proxygw/state
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      # 服务端用公共 CA 证书时用 ca；pin 模式则设置 pin/pins
      TLS_MODE: ${TLS_MODE:-ca}
      TLS_PIN: ${TLS_PIN:-}
      TLS_PINS: ${TLS_PINS:-}
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      EGRESS_IP: ${EGRESS_IP:-}
      EGRESS_IP6: ${EGRESS_IP6:-}
    volumes:
      # 命名卷默认按 CLIENT_ID 命名，避免一机多节点共用 state；也可改用 bind mount
      - proxygw-client-state:/var/lib/proxygw/state
    security_opt:
      - no-new-privileges:true
    # 只读根文件系统也能跑（state 目录单独挂卷可写）
    # read_only: true
    # tmpfs:
    #   - /tmp
    # 如需从源码构建：取消下面 build 注释并执行 docker compose up -d --build
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile.client
    #   args:
    #     VERSION: ${VERSION:-dev}
    #     GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

volumes:
  proxygw-client-state:
    name: proxygw-client-state-${CLIENT_ID:-default}
